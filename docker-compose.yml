# GPU Market Analytics - MongoDB / Kafka / Spark pipeline
#
#   Aquanode API -> producer -> Kafka (gpu_stream) -> Spark Structured Streaming -> MongoDB -> Streamlit
#
# Start:  docker compose up --build        Open: http://localhost:8501
# Stop:   docker compose down              (add -v to also delete stored data)

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: gpu-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # 'kafka:9092' for containers, 'localhost:29092' for tools running on your own machine
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: gpu-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic gpu_stream --partitions 1 --replication-factor 1
    restart: "no"

  mongo:
    image: mongo:7
    container_name: gpu-mongo
    ports:
      - "27017:27017"          # lets you inspect the data with MongoDB Compass
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: gpu-producer
    command: ["python", "-m", "producer"]
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: gpu_stream
      PRODUCER_INTERVAL: "15"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: gpu-spark
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: gpu_stream
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: bigdata_db
      AGG_WINDOW: "1 minute"
    volumes:
      - spark-checkpoints:/tmp/spark-checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: gpu-dashboard
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: gpu_stream
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: bigdata_db
      AGG_WINDOW: "1 minute"
    ports:
      - "8501:8501"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  mongo-data:
  spark-checkpoints:
